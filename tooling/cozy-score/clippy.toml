# Determinism: the platform maths library differs between Linux, macOS and
# Windows, so all transcendental functions must come from the `libm` crate.
disallowed-methods = [
  { path = "f64::sin", reason = "use libm::sin for cross-platform determinism" },
  { path = "f64::cos", reason = "use libm::cos for cross-platform determinism" },
  { path = "f64::tan", reason = "use libm::tan for cross-platform determinism" },
  { path = "f64::exp", reason = "use libm::exp for cross-platform determinism" },
  { path = "f64::tanh", reason = "use libm::tanh for cross-platform determinism" },
  { path = "f64::powf", reason = "use libm::pow for cross-platform determinism" },
  { path = "f64::powi", reason = "use libm::pow for cross-platform determinism" },
  { path = "f64::ln", reason = "use libm::log for cross-platform determinism" },
  { path = "f64::log10", reason = "use libm::log10 for cross-platform determinism" },
  { path = "f64::log2", reason = "use libm::log2 for cross-platform determinism" },
  { path = "f64::exp2", reason = "use libm::exp2 for cross-platform determinism" },
  { path = "f64::sin_cos", reason = "use libm::sincos for cross-platform determinism" },
  { path = "f64::mul_add", reason = "fused multiply-add changes results between CPUs" },
  { path = "f32::sin", reason = "use libm for cross-platform determinism" },
  { path = "f32::cos", reason = "use libm for cross-platform determinism" },
  { path = "f32::exp", reason = "use libm for cross-platform determinism" },
  { path = "f32::tanh", reason = "use libm for cross-platform determinism" },
  { path = "f32::powf", reason = "use libm for cross-platform determinism" },
  { path = "f32::mul_add", reason = "fused multiply-add changes results between CPUs" },
]

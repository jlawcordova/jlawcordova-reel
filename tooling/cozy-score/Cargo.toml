[package]
name = "cozy-score"
version = "0.1.0"
edition = "2021"
description = "Generates cozy farm-sim style background music that follows a video plan"
publish = false

# Standalone crate: never part of a parent workspace.
[workspace]

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
hound = "=3.5.1"
libm = "=0.2.16"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
sha2 = "=0.11.1"

# Tests render audio; keep them fast. Optimisation never changes float results
# here (Rust does not reassociate or contract floating-point maths).
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
